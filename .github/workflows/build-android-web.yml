name: Build Android APK and Flutter Web

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - 'web/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and Web platform scaffolding
        run: flutter create --platforms=android,web --project-name lasalgaon_payroll .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Static analysis
        run: flutter analyze
      - name: Flutter tests
        run: flutter test

  build-android:
    name: Build Android release APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffolding
        run: flutter create --platforms=android --project-name lasalgaon_payroll .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lasalgaon-payroll-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  build-web:
    name: Build Flutter Web
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Web platform scaffolding
        run: flutter create --platforms=web --project-name lasalgaon_payroll .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build release Web app
        run: flutter build web --release
      - name: Package Web output
        run: zip -r flutter-web-build.zip build/web
      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: lasalgaon-payroll-flutter-web
          path: flutter-web-build.zip
          if-no-files-found: error
          retention-days: 30
